name: Consolidate E2E Reports

on:
  repository_dispatch:
    types:
      - consolidate-report

  workflow_dispatch:

jobs:
  consolidate-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # ============================================================
      # ALL MFE REPOSITORIES
      # Replace these with your actual repository names.
      # ============================================================
      ALL_MFE_REPOSITORIES: |
        Q4US/dashboard
        Q4US/user-management
        Q4US/ask-ai
        Q4US/profile
        Q4US/react-tree
        Q4US/error-reports
        Q4US/audit

    steps:

      # ============================================================
      # 1. Checkout aggregator repository
      # ============================================================

      - name: Checkout aggregator repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Display trigger information
      # ============================================================

      - name: Show trigger information
        run: |
          echo "========================================"
          echo "Consolidated Report Trigger"
          echo "========================================"

          echo "Trigger Repository: ${{ github.event.client_payload.repository }}"
          echo "Trigger Run ID:     ${{ github.event.client_payload.run_id }}"
          echo "Trigger Run Number: ${{ github.event.client_payload.run_number }}"
          echo "Trigger Branch:     ${{ github.event.client_payload.branch }}"
          echo "Trigger Commit:     ${{ github.event.client_payload.sha }}"

      # ============================================================
      # 3. Setup Node
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 4. Initialize Node project
      # ============================================================

      - name: Initialize Node project
        run: npm init -y
      
      - name: Install reporting tools
        run: |
          npm install puppeteer
          npm install xlsx-populate

      # ============================================================
      # 5. Install Mochawesome tools
      # ============================================================

      - name: Install Mochawesome tools
        run: |
          npm install mochawesome-merge
          npm install mochawesome-report-generator

      # ============================================================
      # 6. Prepare directories
      # ============================================================

      - name: Prepare directories
        run: |
          rm -rf reports
          rm -rf consolidated-report

          mkdir -p reports
          mkdir -p consolidated-report/source-reports

      # ============================================================
      # 7. Determine triggering repository
      # ============================================================

      - name: Determine triggering repository
        id: trigger
        run: |
          TRIGGER_REPOSITORY="${{ github.event.client_payload.repository }}"
          TRIGGER_RUN_ID="${{ github.event.client_payload.run_id }}"
          TRIGGER_RUN_NUMBER="${{ github.event.client_payload.run_number }}"

          if [ -z "$TRIGGER_REPOSITORY" ]; then
            echo "ERROR: Trigger repository is empty"
            exit 1
          fi

          if [ -z "$TRIGGER_RUN_ID" ]; then
            echo "ERROR: Trigger run ID is empty"
            exit 1
          fi

          if [ -z "$TRIGGER_RUN_NUMBER" ]; then
            echo "ERROR: Trigger run number is empty"
            exit 1
          fi

          echo "Triggering repository: $TRIGGER_REPOSITORY"
          echo "Triggering run ID: $TRIGGER_RUN_ID"
          echo "Triggering run number: $TRIGGER_RUN_NUMBER"

          echo "repository=$TRIGGER_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "run_id=$TRIGGER_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_number=$TRIGGER_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8. Download EXACT report from triggering repository
      # ============================================================

      - name: Download triggering repository report
        env:
          GH_TOKEN: ${{ secrets.REPORT_READER_TOKEN }}
          REPOSITORY: ${{ steps.trigger.outputs.repository }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
          RUN_NUMBER: ${{ steps.trigger.outputs.run_number }}
        run: |
          REPO_NAME="${REPOSITORY##*/}"

          echo "========================================"
          echo "Triggering Repository"
          echo "========================================"

          echo "Repository: $REPOSITORY"
          echo "Run ID: $RUN_ID"
          echo "Run Number: $RUN_NUMBER"
          echo "Repository Name: $REPO_NAME"

          mkdir -p "reports/$REPO_NAME"

          ARTIFACT_NAME="mochawesome-report-$RUN_NUMBER"

          echo "Downloading artifact: $ARTIFACT_NAME"

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "reports/$REPO_NAME"

      # ============================================================
      # 9. Prepare triggering repository JSON
      # ============================================================

      - name: Prepare triggering repository report
        env:
          REPOSITORY: ${{ steps.trigger.outputs.repository }}
        run: |
          REPO_NAME="${REPOSITORY##*/}"

          REPORT_JSON=$(find "reports/$REPO_NAME" \
            -name "index.json" \
            -type f | head -1)

          if [ -z "$REPORT_JSON" ]; then
            echo "ERROR: No index.json found for $REPOSITORY"
            exit 1
          fi

          mkdir -p "consolidated-report/source-reports/$REPO_NAME"

          cp -R \
            "reports/$REPO_NAME/." \
            "consolidated-report/source-reports/$REPO_NAME/"

          echo "Prepared $REPO_NAME"
          find "consolidated-report/source-reports/$REPO_NAME" \
            -type f -print

      # ============================================================
      # 10. Download latest reports from OTHER MFEs
      # ============================================================

      - name: Download latest available reports from other MFEs
        env:
          GH_TOKEN: ${{ secrets.REPORT_READER_TOKEN }}
          TRIGGER_REPOSITORY: ${{ github.event.client_payload.repository }}
          ALL_MFE_REPOSITORIES: |
            Q4US/dashboard
            Q4US/user-management
            Q4US/ask-ai
            Q4US/profile
            Q4US/react-tree
            Q4US/error-reports
            Q4US/audit
        run: |

          echo "========================================"
          echo "Other MFE Reports"
          echo "========================================"

          while IFS= read -r REPOSITORY; do
            [ -z "$REPOSITORY" ] && continue

            if [ "$REPOSITORY" = "$TRIGGER_REPOSITORY" ]; then
              echo ""
              echo "Skipping triggering repository:"
              echo "$REPOSITORY"
              continue
            fi

            echo ""
            echo "----------------------------------------"
            echo "Processing: $REPOSITORY"
            echo "----------------------------------------"

            REPO_NAME="${REPOSITORY##*/}"

            mkdir -p "reports/$REPO_NAME"

            # ------------------------------------------------------
            # Get recent successful runs
            # ------------------------------------------------------

            RUN_INFO=$(gh run list \
              --repo "$REPOSITORY" \
              --workflow "QA E2E Tests" \
              --branch master \
              --status success \
              --limit 10 \
              --json databaseId,number,createdAt)

            if [ -z "$RUN_INFO" ] || [ "$RUN_INFO" = "[]" ]; then
              echo "ERROR: No successful QA E2E Tests runs found"
              echo "Repository: $REPOSITORY"
              exit 1
            fi

            FOUND_RUN_ID=""
            FOUND_RUN_NUMBER=""
            FOUND_ARTIFACT=""

            # ------------------------------------------------------
            # Search runs until an available Mochawesome artifact
            # is found
            # ------------------------------------------------------

            while IFS= read -r RUN_ID; do

              RUN_NUMBER=$(echo "$RUN_INFO" | jq -r \
                ".[] | select(.databaseId == $RUN_ID) | .number")

              CREATED_AT=$(echo "$RUN_INFO" | jq -r \
                ".[] | select(.databaseId == $RUN_ID) | .createdAt")

              echo ""
              echo "Checking successful run:"
              echo "Run ID: $RUN_ID"
              echo "Run Number: $RUN_NUMBER"
              echo "Created: $CREATED_AT"

              # ----------------------------------------------------
              # Check artifacts belonging to this run
              # ----------------------------------------------------

              ARTIFACT_NAME=$(gh api \
                "/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
                --jq '.artifacts[]
                  | select(.expired == false)
                  | select(.name | startswith("mochawesome-report-"))
                  | .name' \
                | head -1)

              if [ -n "$ARTIFACT_NAME" ]; then

                echo "Available Mochawesome artifact found:"
                echo "$ARTIFACT_NAME"

                FOUND_RUN_ID="$RUN_ID"
                FOUND_RUN_NUMBER="$RUN_NUMBER"
                FOUND_ARTIFACT="$ARTIFACT_NAME"

                break

              else

                echo "No available Mochawesome artifact for this run."

              fi

            done < <(
              echo "$RUN_INFO" |
                jq -r 'sort_by(.createdAt) | reverse | .[].databaseId'
            )

            # ------------------------------------------------------
            # Ensure a report was found
            # ------------------------------------------------------

            if [ -z "$FOUND_ARTIFACT" ]; then

              echo ""
              echo "ERROR: No available Mochawesome artifact found"
              echo "Repository: $REPOSITORY"
              echo ""
              echo "Checked recent successful runs:"
              echo "$RUN_INFO" | jq -r \
                '.[] | "Run \(.number) - \(.databaseId) - \(.createdAt)"'

              exit 1
            fi

            echo ""
            echo "========================================"
            echo "SELECTED REPORT"
            echo "========================================"
            echo "Repository: $REPOSITORY"
            echo "Run ID: $FOUND_RUN_ID"
            echo "Run Number: $FOUND_RUN_NUMBER"
            echo "Artifact: $FOUND_ARTIFACT"

            # ------------------------------------------------------
            # Download artifact
            # ------------------------------------------------------

            gh run download "$FOUND_RUN_ID" \
              --repo "$REPOSITORY" \
              --name "$FOUND_ARTIFACT" \
              --dir "reports/$REPO_NAME"

            # ------------------------------------------------------
            # Find index.json
            # ------------------------------------------------------

            REPORT_JSON=$(find "reports/$REPO_NAME" \
              -name "index.json" \
              -type f | head -1)

            if [ -z "$REPORT_JSON" ]; then

              echo ""
              echo "ERROR: No index.json found"
              echo "Repository: $REPOSITORY"
              echo "Artifact: $FOUND_ARTIFACT"

              exit 1

            fi

            echo ""
            echo "Found JSON:"
            echo "$REPORT_JSON"

            # ------------------------------------------------------
            # Copy entire report
            # ------------------------------------------------------

            mkdir -p \
              "consolidated-report/source-reports/$REPO_NAME"

            cp -R \
              "reports/$REPO_NAME/." \
              "consolidated-report/source-reports/$REPO_NAME/"

            echo ""
            echo "Prepared:"
            echo "consolidated-report/source-reports/$REPO_NAME"

            find \
              "consolidated-report/source-reports/$REPO_NAME" \
              -type f \
              -print

          done <<< "$ALL_MFE_REPOSITORIES"

      # ============================================================
      # 11. Display all source reports
      # ============================================================

      - name: Show source reports
        run: |
          echo "========================================"
          echo "SOURCE REPORTS"
          echo "========================================"

          find consolidated-report/source-reports \
            -type f \
            -name "*.json" \
            -print

      # ============================================================
      # 12. Validate all reports exist
      # ============================================================

      - name: Validate source reports
        run: |
          EXPECTED_COUNT=$(echo "$ALL_MFE_REPOSITORIES" | grep -c '[^[:space:]]')

          PROJECT_COUNT=$(find consolidated-report/source-reports \
            -mindepth 1 \
            -maxdepth 1 \
            -type d | wc -l)

          echo "Expected projects: $EXPECTED_COUNT"
          echo "Downloaded projects: $PROJECT_COUNT"

          echo ""
          echo "Projects:"
          find consolidated-report/source-reports \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' | sort

          if [ "$PROJECT_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo ""
            echo "ERROR: Expected $EXPECTED_COUNT projects"
            echo "Found: $PROJECT_COUNT"
            exit 1
          fi

          echo ""
          echo "All $EXPECTED_COUNT project reports are available."

          echo ""
          echo "Checking index.json files..."

          for PROJECT_DIR in consolidated-report/source-reports/*; do

            [ -d "$PROJECT_DIR" ] || continue

            REPORT_JSON=$(find "$PROJECT_DIR" \
              -name "index.json" \
              -type f | head -1)

            if [ -z "$REPORT_JSON" ]; then
              echo "ERROR: No index.json found in $PROJECT_DIR"
              exit 1
            fi

            echo "OK: $REPORT_JSON"

          done

      - name: Create project-grouped consolidated JSON
        run: |
          echo "========================================"
          echo "CREATING PROJECT-GROUPED JSON"
          echo "========================================"

          node .github/scripts/consolidate-mochawesome.js
      

      # ============================================================
      # 13. Verify consolidated JSON
      # ============================================================

      - name: Verify consolidated JSON
        run: |
          echo "========================================"
          echo "CONSOLIDATED JSON"
          echo "========================================"

          node - <<'NODE'
          const fs = require('fs');

          const file = 'consolidated-report/consolidated.json';

          if (!fs.existsSync(file)) {
            console.error('ERROR: consolidated.json not found');
            process.exit(1);
          }

          const data = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          console.log('Suites:', data.stats?.suites);
          console.log('Tests:', data.stats?.tests);
          console.log('Registered:', data.stats?.testsRegistered);
          console.log('Passed:', data.stats?.passes);
          console.log('Failed:', data.stats?.failures);
          console.log('Pending:', data.stats?.pending);
          console.log('Skipped:', data.stats?.skipped);
          console.log('Pass %:', data.stats?.passPercent);
          console.log('Results:', data.results?.length);

          if (!data.results || data.results.length === 0) {
            console.error('ERROR: Consolidated report contains no results');
            process.exit(1);
          }
          NODE
      # ============================================================
      # 14. Validating assets in consolidated JSON
      # ============================================================

      - name: Validate consolidated assets
        run: |
          echo "========================================"
          echo "VALIDATING REPORT ASSETS"
          echo "========================================"

          echo ""
          echo "Project directories:"
          find consolidated-report/source-reports \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort

          echo ""
          echo "JSON files:"
          find consolidated-report/source-reports \
            -name "index.json" \
            -type f \
            -print

          echo ""
          echo "Screenshots:"
          find consolidated-report/source-reports \
            -type f \
            -path "*/screenshots/*" \
            | wc -l

          echo ""
          echo "Videos:"
          find consolidated-report/source-reports \
            -type f \
            -path "*/videos/*" \
            | wc -l
      # ============================================================
      # 15. Generate consolidated HTML
      # ============================================================

      - name: Generate consolidated HTML report
        run: |
          mkdir -p consolidated-report/html

          npx marge \
            consolidated-report/consolidated.json \
            --reportDir consolidated-report/html \
            --reportFilename index.html

      - name: Generate consolidated PDF
        run: |
          node .github/scripts/generate-consolidated-pdf.js \
            consolidated-report/consolidated.json \
            consolidated-report/final

      - name: Generate consolidated Excel
        run: |
          node .github/scripts/generate-consolidated-excel.js \
            consolidated-report/consolidated.json \
            .github/scripts/template/consolidated-template.xlsm \
            consolidated-report/final

      # ============================================================
      # 16. Show final report structure
      # ============================================================

      - name: Show final report structure
        run: |
          echo "========================================"
          echo "FINAL CONSOLIDATED REPORT"
          echo "========================================"

          find consolidated-report \
            -type f \
            -print
      # ============================================================
      # 17. Generate Teams Notification
      # ============================================================

      - name: Generate Teams Notification
        id: generate-teams-card
        if: always()
        env:
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "========================================"
          echo "GENERATING TEAMS NOTIFICATION"
          echo "========================================"

          if [ ! -f consolidated-report/consolidated.json ]; then
            echo "ERROR: consolidated.json not found"
            exit 1
          fi

          node .github/scripts/generate-teams-card.js \
            consolidated-report/consolidated.json \
            teams-card.json

          echo ""
          echo "Teams card generated:"
          ls -lh teams-card.json

          echo ""
          echo "Teams card validation:"
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('teams-card.json', 'utf8'));

            console.log('Type:', data.type);
            console.log('Attachments:', data.attachments?.length);
            console.log(
              'Card type:',
              data.attachments?.[0]?.content?.type
            );
            console.log(
              'Card version:',
              data.attachments?.[0]?.content?.version
            );
          "


      # ============================================================
      # Send Notification to Teams
      # ============================================================

      - name: Send Notification to Teams
        id: send-teams-notification
        if: always() && steps.generate-teams-card.outcome == 'success'
        continue-on-error: true
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          echo "========================================"
          echo "SENDING CONSOLIDATED REPORT TO TEAMS"
          echo "========================================"

          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "ERROR: TEAMS_WEBHOOK_URL secret is empty or unavailable."
            exit 1
          fi

          if [ ! -f teams-card.json ]; then
            echo "ERROR: teams-card.json was not generated."
            exit 1
          fi

          echo "Webhook is configured."
          echo "Sending Teams Adaptive Card..."

          HTTP_CODE=$(curl \
            -sS \
            -o teams-response.txt \
            -w "%{http_code}" \
            -H "Content-Type: application/json" \
            --data-binary @teams-card.json \
            "$TEAMS_WEBHOOK_URL")

          echo ""
          echo "Teams HTTP status: $HTTP_CODE"

          echo ""
          echo "Teams response:"
          cat teams-response.txt || true

          echo ""

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Teams notification sent successfully."
          else
            echo "ERROR: Teams webhook returned HTTP $HTTP_CODE"
            exit 1
          fi


      # ============================================================
      # Upload ONE Final Artifact
      # ============================================================

      - name: Upload Final Consolidated Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-final-reports
          path: |
            consolidated-report/
            teams-card.json
          if-no-files-found: warn