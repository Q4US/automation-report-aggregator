name: Consolidate E2E Reports

on:
  repository_dispatch:
    types:
      - consolidate-report

  workflow_dispatch:

jobs:
  download-dashboard-report:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger information
        run: |
          echo "Repository: ${{ github.event.client_payload.repository }}"
          echo "Run ID: ${{ github.event.client_payload.run_id }}"
          echo "Run Number: ${{ github.event.client_payload.run_number }}"
          echo "Branch: ${{ github.event.client_payload.branch }}"
          echo "Commit: ${{ github.event.client_payload.sha }}"

      # - name: Download Dashboard final reports
      #   env:
      #     GH_TOKEN: ${{ secrets.REPORT_READER_TOKEN }}
      #     REPOSITORY: ${{ github.event.client_payload.repository }}
      #     RUN_ID: ${{ github.event.client_payload.run_id }}
      #   run: |
      #     mkdir -p reports

      #     echo "Downloading artifact from:"
      #     echo "Repository: $REPOSITORY"
      #     echo "Run ID: $RUN_ID"

      #     gh run download "$RUN_ID" \
      #       --repo "$REPOSITORY" \
      #       --name final_test_reports \
      #       --dir reports

      # - name: Show downloaded files
      #   run: |
      #     echo "Downloaded files:"
      #     find reports -type f -print
      
      - name: Download Dashboard Mochawesome report
        env:
          GH_TOKEN: ${{ secrets.REPORT_READER_TOKEN }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
          RUN_NUMBER: ${{ github.event.client_payload.run_number }}
        run: |
          mkdir -p mochawesome

          echo "Downloading Mochawesome artifact..."
          echo "Repository: $REPOSITORY"
          echo "Run ID: $RUN_ID"
          echo "Run Number: $RUN_NUMBER"

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name "mochawesome-report-$RUN_NUMBER" \
            --dir mochawesome

      - name: Show downloaded Mochawesome files
        run: |
          echo "Downloaded Mochawesome files:"
          find mochawesome -type f -print

            - name: Inspect Dashboard Mochawesome JSON
        run: |
          echo "Finding Mochawesome JSON files..."

          find mochawesome -name "index.json" -type f -print

          echo ""
          echo "JSON file count:"
          find mochawesome -name "index.json" -type f | wc -l

          echo ""
          echo "First JSON file:"
          REPORT_JSON=$(find mochawesome -name "index.json" -type f | head -1)

          echo "REPORT_JSON=$REPORT_JSON"

          echo ""
          echo "Report size:"
          wc -c "$REPORT_JSON"

          echo ""
          echo "Report structure:"
          node -e "
            const fs = require('fs');
            const file = process.argv[1];
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));

            console.log('Title:', data.title);
            console.log('Stats:', data.stats);
            console.log('Results:', data.results?.length || 0);
          " "$REPORT_JSON"
