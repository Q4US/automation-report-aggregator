      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize Node project
        run: npm init -y

      - name: Install Mochawesome merge tools
        run: npm install mochawesome-merge mochawesome-report-generator

      - name: Download Dashboard Mochawesome report
        env:
          GH_TOKEN: ${{ secrets.REPORT_READER_TOKEN }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
          RUN_NUMBER: ${{ github.event.client_payload.run_number }}
        run: |
          mkdir -p mochawesome

          echo "Downloading Mochawesome artifact..."
          echo "Repository: $REPOSITORY"
          echo "Run ID: $RUN_ID"
          echo "Run Number: $RUN_NUMBER"

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name "mochawesome-report-$RUN_NUMBER" \
            --dir mochawesome

      - name: Show downloaded Mochawesome files
        run: |
          echo "Downloaded Mochawesome files:"
          find mochawesome -type f -print
      
