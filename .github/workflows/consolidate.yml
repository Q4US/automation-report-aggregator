      - name: Prepare consolidated report directory
        run: |
          mkdir -p consolidated-report/source-reports

          REPORT_JSON=$(find mochawesome -name "index.json" -type f | head -1)

          echo "Dashboard Mochawesome JSON:"
          echo "$REPORT_JSON"

          if [ -z "$REPORT_JSON" ]; then
            echo "ERROR: No index.json found"
            exit 1
          fi

          cp "$REPORT_JSON" \
             consolidated-report/source-reports/dashboard.json

          echo "Source report:"
          ls -lh consolidated-report/source-reports/dashboard.json

      - name: Merge Mochawesome reports
        run: |
          npx mochawesome-merge "consolidated-report/source-reports/*.json" \
            -o consolidated-report/consolidated.json

      - name: Generate consolidated HTML report
        run: |
          npx marge consolidated-report/consolidated.json \
            --reportDir consolidated-report \
            --reportFilename index.html

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-mochawesome-report
          path: consolidated-report/