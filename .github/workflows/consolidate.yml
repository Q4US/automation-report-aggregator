      # - name: Verify consolidated report
      #   run: |
      #     echo "Consolidated report files:"
      #     find consolidated-report -type f -print

      #     echo ""
      #     echo "Consolidated JSON:"
      #     node -e "
      #       const fs = require('fs');

      #       const data = JSON.parse(
      #         fs.readFileSync('consolidated.json', 'utf8')
      #       );

      #       console.log('Suites:', data.stats?.suites);
